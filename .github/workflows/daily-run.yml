name: ArXiv Daily Research

on:
  # 每天 UTC 00:00 = 北京时间 08:00（配置完 Secrets 后取消注释启用）
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: research-state
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-core.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-core.txt

      - name: Create .env from secrets
        run: |
          cat > .env << 'ENVEOF'
          CHEAP_LLM__API_KEY=${{ secrets.CHEAP_LLM_API_KEY }}
          CHEAP_LLM__BASE_URL=${{ secrets.CHEAP_LLM_BASE_URL }}
          CHEAP_LLM__MODEL_NAME=${{ secrets.CHEAP_LLM_MODEL_NAME }}
          CHEAP_LLM__TEMPERATURE=${{ secrets.CHEAP_LLM_TEMPERATURE }}
          SMART_LLM__API_KEY=${{ secrets.SMART_LLM_API_KEY }}
          SMART_LLM__BASE_URL=${{ secrets.SMART_LLM_BASE_URL }}
          SMART_LLM__MODEL_NAME=${{ secrets.SMART_LLM_MODEL_NAME }}
          SMART_LLM__TEMPERATURE=${{ secrets.SMART_LLM_TEMPERATURE }}
          OPENALEX_API_KEY=${{ secrets.OPENALEX_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY=${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          ENABLE_NOTIFICATIONS=${{ secrets.ENABLE_NOTIFICATIONS }}
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM=${{ secrets.SMTP_FROM }}
          SMTP_TO=${{ secrets.SMTP_TO }}
          WECHAT_WEBHOOK_URL=${{ secrets.WECHAT_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL=${{ secrets.DINGTALK_WEBHOOK_URL }}
          DINGTALK_SECRET=${{ secrets.DINGTALK_SECRET }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL=${{ secrets.SLACK_WEBHOOK_URL }}
          GENERIC_WEBHOOK_URL=${{ secrets.GENERIC_WEBHOOK_URL }}
          ENVEOF

      - name: Restore previous data
        uses: actions/cache/restore@v4
        with:
          path: |
            data/keywords/
            data/daily_research/
          key: research-state-${{ github.run_id }}
          restore-keys: |
            research-state-

      - name: Create data directories
        run: |
          mkdir -p data/reports/daily_research/markdown \
                   data/reports/daily_research/html \
                   data/reports/trend_research/markdown \
                   data/reports/trend_research/html \
                   data/reports/keyword_trend/markdown \
                   data/reports/keyword_trend/html \
                   data/keywords data/daily_research data/run \
                   data/reference_pdfs data/downloaded_pdfs logs

      - name: Prepare runtime config
        run: |
          mkdir -p runtime
          if [ -f configs/config.site.json ]; then
            cp configs/config.site.json runtime/config.json
            echo "Using configs/config.site.json"
          else
            echo "No config.site.json; using built-in defaults"
          fi

      - name: Run research pipeline
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Upload reports as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-reports-${{ github.run_number }}
          path: |
            data/reports/
            logs/
          retention-days: 30

      - name: Publish reports to site (source branch)
        if: always()
        env:
          PAGES_PAT: ${{ secrets.PAGES_PAT }}
        run: |
          set -euo pipefail
          SITE=$(mktemp -d)
          git clone --depth 1 --branch source \
            "https://x-access-token:${PAGES_PAT}@github.com/pengzhao311/pengzhao311.github.io.git" "$SITE"

          mkdir -p "$SITE/source/arxiv/reports"
          if [ -d data/reports/daily_research/html ]; then
            cp -a data/reports/daily_research/html/. "$SITE/source/arxiv/reports/" || true
          fi

          python scripts/build_site_index.py "$SITE/source/arxiv"

          cd "$SITE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new reports."
          else
            git commit -m "Update arXiv reports: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push origin source
          fi

      - name: Save data for next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/keywords/
            data/daily_research/
          key: research-state-${{ github.run_id }}
